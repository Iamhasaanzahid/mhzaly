name: mhzaly daily outreach

on:
  schedule:
    # 04:00 UTC = 09:00 Pakistan time, every day
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry (collect and import only) or send'
        required: false
        default: 'send'
        type: choice
        options:
          - send
          - dry

permissions:
  contents: read

concurrency:
  group: mhzaly-daily-outreach
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect leads, import to D1, send capped emails
        env:
          MHZALY_API_URL: https://mhzaly-api.mhzaly.workers.dev
          MHZALY_API_KEY: ${{ secrets.MHZALY_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OUTREACH_PK_CAP: '10'
          OUTREACH_INTL_CAP: '10'
        run: |
          MODE="${{ github.event.inputs.mode || 'send' }}"
          if [ "$MODE" = "dry" ]; then
            node tools/cloud-run.mjs --dry
          else
            node tools/cloud-run.mjs --send
          fi

      - name: Record STOP replies and bounces
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          MHZALY_API_URL: https://mhzaly-api.mhzaly.workers.dev
          MHZALY_API_KEY: ${{ secrets.MHZALY_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 tools/cloud-inbox.py

      - name: Summary
        if: always()
        run: echo "mhzaly daily outreach finished at $(date -u)"
