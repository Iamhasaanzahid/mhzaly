services:
  - type: web
    name: mhzaly-ar
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd .. && ls
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 8788
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o
      - key: AI_API_KEY
        value: ""
    healthCheckPath: /api/health
